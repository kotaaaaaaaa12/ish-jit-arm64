name: Build iSH ARM64 for SideStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # coreutils（timeoutコマンド用）を追加！
      - name: Install deps
        run: |
          brew install ninja lld llvm meson coreutils

      - name: Grant execution rights
        run: |
          chmod +x tools/package_arm64_trollstore_ipa.sh

      # 公式のTIPAビルドスクリプトを実行して成果物を作る
      - name: Build TIPA with script
        run: |
          ./tools/package_arm64_trollstore_ipa.sh

      # .tipa を .ipa にコピーしてSideStoreが認識できるようにする
      - name: Prepare IPA for SideStore
        run: |
          cp build/iSH-ARM64-JIT-TrollStore.tipa iSH-ARM64-SideStore.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-SideStore-IPA
          path: iSH-ARM64-SideStore.ipa
