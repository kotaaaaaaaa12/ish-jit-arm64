name: Build iSH ARM64 for SideStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install deps
        run: |
          brew install ninja lld llvm meson ldid

      # エラーの原因になるFileProviderを無視して、本体（iSH-ARM64）だけを直接ビルド！
      - name: Build iSH ARM64 App
        run: |
          xcodebuild -project iSH.xcodeproj \
            -scheme 'iSH-ARM64' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            EXPANDED_CODE_SIGN_IDENTITY=''

      # ビルドされた .app を探して手動でIPA（Zip）にパッケージ化
      - name: Package IPA
        run: |
          mkdir -p payload/Payload
          # DerivedDataの奥底からビルドされた .app フォルダを自動で探して持ってくる
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" payload/Payload/
          cd payload
          zip -r ../iSH-ARM64-SideStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-SideStore-IPA
          path: iSH-ARM64-SideStore.ipa
